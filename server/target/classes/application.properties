# ── Local development (H2 file-based, data persists across restarts) ──────────
# Switch to PostgreSQL for production by setting DATABASE_URL environment variable

# Auto-detect: use DATABASE_URL if set (Railway/Render), else use local H2 file
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/ratprobedb;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

# JPA — update schema on startup, never drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console (local only — disable in production by setting H2_CONSOLE=false)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Server
server.port=${PORT:8080}

# Allow large JSON payloads for session data
spring.mvc.async.request-timeout=30000
server.tomcat.max-swallow-size=10MB
spring.servlet.multipart.max-request-size=10MB
