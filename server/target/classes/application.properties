# ── Database ──────────────────────────────────────────────────────────────────
# Railway injects DATABASE_URL as postgresql://user:pass@host:port/db
# JDBC requires jdbc:postgresql://... so we use JDBC_DATABASE_URL instead,
# which Railway also provides in the correct jdbc:postgresql:// format.

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/ratprobedb;AUTO_SERVER=TRUE}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 console (local dev only)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Server
server.port=${PORT:8080}

# Payload size
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=-1