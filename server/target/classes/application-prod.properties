# ── Production (PostgreSQL on Railway) ───────────────────────────────────────
# Railway provides JDBC_DATABASE_URL, JDBC_DATABASE_USERNAME, JDBC_DATABASE_PASSWORD
# These are the correct jdbc:postgresql:// formatted versions of DATABASE_URL

spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.h2.console.enabled=false

# PostgreSQL dialect auto-detected — no need to set explicitly
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect